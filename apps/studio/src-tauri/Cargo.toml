[package]
name = "uniqent-studio"
version = "0.1.0"
edition = "2021"

[lib]
name = "uniqent_studio"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"
sha2 = "0.10"
tar = "0.4"
flate2 = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
time = { version = "0.3", features = ["formatting"] }
hex = "0.4"
regex = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
