[package]
name = "uniqent-studio"
version = "0.1.0"
edition = "2021"

[lib]
name = "uniqent_studio"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.23"
sha2 = "0.11"
tar = "0.4"
flate2 = "1"
ed25519-dalek = "3"
getrandom = "0.4"
time = { version = "0.3", features = ["formatting"] }
hex = "0.4"
regex = "1"
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
panic = "abort"

[dev-dependencies]
tempfile = "3.27.0"
