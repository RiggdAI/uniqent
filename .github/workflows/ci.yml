name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The toolchain (pnpm 11) needs Node >= 22.13; test the supported lines.
        node-version: [22, 24]
    name: build (node ${{ matrix.node-version }})
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # Provision the exact pnpm from package.json "packageManager" via Node's bundled corepack.
      # Avoids pnpm/action-setup's self-installer, which fails on the runner ("self-installer
      # exits with code 1"). corepack@latest carries current signing keys for pnpm 10/11.
      - name: Enable pnpm (corepack)
        run: |
          npm install -g corepack@latest
          corepack enable
          corepack prepare --activate

      - run: pnpm install --frozen-lockfile

      # Build first: typecheck and tests resolve cross-package imports via each package's
      # emitted dist/*.d.ts, which do not exist until tsc emits them.
      - run: pnpm build

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm test

  # Install the packages the way npm users get them: `pnpm pack` every package (which rewrites
  # workspace:^ ranges to real versions), install all tarballs together into a fresh npm
  # project, and run the published `uniqent` bin end to end. Catches missing files/exports/deps
  # in the tarballs that workspace links hide.
  pack-smoke:
    runs-on: ubuntu-latest
    name: npm pack smoke (uniqent from tarballs)
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm (corepack)
        run: |
          npm install -g corepack@latest
          corepack enable
          corepack prepare --activate

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Pack every package
        run: |
          mkdir -p "$RUNNER_TEMP/tarballs"
          for dir in packages/*/; do
            (cd "$dir" && pnpm pack --pack-destination "$RUNNER_TEMP/tarballs")
          done
          ls -l "$RUNNER_TEMP/tarballs"

      - name: Install the tarballs into a fresh npm project
        working-directory: ${{ runner.temp }}
        run: |
          mkdir smoke && cd smoke
          npm init -y
          npm install --no-audit --no-fund "$RUNNER_TEMP"/tarballs/*.tgz

      - name: uniqent --help
        working-directory: ${{ runner.temp }}/smoke
        run: npx --no-install uniqent --help

      - name: uniqent try research-analyst (claude-code)
        working-directory: ${{ runner.temp }}/smoke
        run: |
          root="$(mktemp -d)"
          npx --no-install uniqent try research-analyst --target claude-code --root "$root" --yes
          test -f "$root/AGENTS.md"
          test -f "$root/.mcp.json"

  studio-rust:
    runs-on: macos-latest
    name: studio (cargo test + clippy)
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/studio/src-tauri

      - name: cargo test
        run: |
          source "$HOME/.cargo/env"
          cargo test
        working-directory: apps/studio/src-tauri

      - name: cargo clippy
        run: |
          source "$HOME/.cargo/env"
          cargo clippy --all-targets -- -D warnings
        working-directory: apps/studio/src-tauri
