name: Release

# Publish all public @uniqent/* packages to npm when a version tag is pushed.
# Tag a release with:  git tag v0.1.2 && git push origin v0.1.2
# Requires an npm automation token in the repo secret NPM_TOKEN (bypasses 2FA OTP).
on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # for npm provenance attestations

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      # Emit a verifiable provenance statement for each published package.
      NPM_CONFIG_PROVENANCE: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # Writes ~/.npmrc with the registry auth token used by pnpm publish.
          registry-url: 'https://registry.npmjs.org'

      # Provision the exact pnpm from package.json "packageManager" via corepack
      # (mirrors ci.yml — pnpm/action-setup's self-installer fails on the runner).
      - name: Enable pnpm (corepack)
        run: |
          npm install -g corepack@latest
          corepack enable
          corepack prepare --activate

      - run: pnpm install --frozen-lockfile

      # Build first: cli's prepublishOnly also rebuilds, but building here lets the
      # gates below resolve cross-package dist/*.d.ts before we publish.
      - run: pnpm build

      - run: pnpm typecheck

      - run: pnpm test

      # pnpm publish skips versions already on npm, so a package whose code changed without a
      # version bump silently stays stale on npm while its dependents ship code that needs the new
      # version (e.g. builder importing a core export the published core lacks). For every package
      # whose version is already on npm, the freshly built dist/ must equal the published one.
      - name: Require a version bump for every package whose code changed
        run: |
          gate="$RUNNER_TEMP/version-gate"
          fail=0
          for dir in packages/*; do
            name="$(node -p "require('./${dir}/package.json').name")"
            version="$(node -p "require('./${dir}/package.json').version")"
            if ! published="$(npm view "${name}@${version}" version 2>&1)"; then
              if grep -q E404 <<<"$published"; then
                echo "${name} is not on npm yet"
                continue
              fi
              echo "::error::npm view ${name}@${version} failed: ${published}"
              exit 1
            fi
            if [ -z "$published" ]; then
              echo "${name}@${version} is new"
              continue
            fi
            rm -rf "$gate" && mkdir -p "$gate/local" "$gate/npm"
            (cd "$dir" && pnpm pack --pack-destination "$gate/local" >/dev/null)
            npm pack "${name}@${version}" --pack-destination "$gate/npm" >/dev/null
            tar -xzf "$gate"/local/*.tgz -C "$gate/local"
            tar -xzf "$gate"/npm/*.tgz -C "$gate/npm"
            if ! diff -rq "$gate/local/package/dist" "$gate/npm/package/dist"; then
              echo "::error file=${dir}/package.json::${name}@${version} is already on npm with different code; bump its version"
              fail=1
            fi
          done
          exit "$fail"

      # Publish every public package. pnpm skips versions already on the registry,
      # so re-running the same tag is safe (idempotent). The cli's prepublishOnly
      # regenerates the signed featured/ bundle so it ships in the tarball.
      - name: Publish to npm
        run: pnpm -r --filter "./packages/*" publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
