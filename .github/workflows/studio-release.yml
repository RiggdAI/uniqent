name: Studio release

# Build the native Studio as a universal macOS DMG and attach it to a GitHub Release.
# Tag with:  git tag studio-v0.1.0 && git push origin studio-v0.1.0  (must match tauri.conf.json "version",
# which must equal the src-tauri Cargo.toml package version)
# Signing, notarization and updater artifacts run only when their secrets exist.
on:
  push:
    tags: ['studio-v*']

concurrency:
  group: studio-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      BUNDLE: apps/studio/src-tauri/target/universal-apple-darwin/release/bundle
      MAX_DMG_KB: '15360'
      MAX_APP_KB: '30720'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm (corepack)
        run: |
          npm install -g corepack@latest
          corepack enable
          corepack prepare --activate

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/studio/src-tauri

      - name: Tag matches the app version
        run: |
          app="$(node -p "require('./apps/studio/src-tauri/tauri.conf.json').version")"
          crate="$(awk -F'"' '/^\[/ { pkg = ($0 == "[package]") } pkg && /^version *=/ { print $2; exit }' apps/studio/src-tauri/Cargo.toml)"
          if [ "$GITHUB_REF_NAME" != "studio-v$app" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match tauri.conf.json version (studio-v$app)"
            exit 1
          fi
          if [ "$crate" != "$app" ]; then
            echo "::error::apps/studio/src-tauri/Cargo.toml version (${crate:-none found}) does not match tauri.conf.json version ($app)"
            exit 1
          fi

      - name: Apple secrets are complete
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Report names only, never values. Signing needs the certificate, its password and the
          # identity; notarization needs the Apple ID, its app password and the team id.
          missing=()
          if [ -n "$APPLE_CERTIFICATE" ]; then
            [ -n "$APPLE_CERTIFICATE_PASSWORD" ] || missing+=("APPLE_CERTIFICATE_PASSWORD (needed with APPLE_CERTIFICATE)")
            [ -n "$APPLE_SIGNING_IDENTITY" ] || missing+=("APPLE_SIGNING_IDENTITY (needed with APPLE_CERTIFICATE)")
          fi
          if [ -n "$APPLE_ID" ]; then
            [ -n "$APPLE_PASSWORD" ] || missing+=("APPLE_PASSWORD (needed with APPLE_ID)")
            [ -n "$APPLE_TEAM_ID" ] || missing+=("APPLE_TEAM_ID (needed with APPLE_ID)")
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            joined="$(printf '%s, ' "${missing[@]}")"
            echo "::error::Apple secrets are half-configured; missing: ${joined%, }"
            exit 1
          fi

      - name: Release does not exist yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if out="$(gh release view "$GITHUB_REF_NAME" --json tagName 2>&1)"; then
            echo "::error::release $GITHUB_REF_NAME already exists; delete it (gh release delete $GITHUB_REF_NAME) or push a new tag"
            exit 1
          fi
          case "$out" in
            *"release not found"*) ;;
            *)
              echo "::error::cannot check whether release $GITHUB_REF_NAME exists: $out"
              exit 1
              ;;
          esac

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Build universal app + DMG
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Unset secrets arrive as empty strings; Tauri must not see them at all.
          if [ -z "$APPLE_CERTIFICATE" ]; then
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
            echo "::warning::no APPLE_CERTIFICATE secret: building an unsigned DMG (users right-click → Open on first launch)"
          elif [ -z "$APPLE_ID" ]; then
            unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
            echo "::warning::signing without notarization (no APPLE_ID secret)"
          fi
          args=(--target universal-apple-darwin)
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            args+=(--config '{"bundle":{"createUpdaterArtifacts":true}}')
          else
            unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          fi
          pnpm --filter @uniqent/studio exec tauri build "${args[@]}"

      - name: Size gate
        run: |
          app="$BUNDLE/macos/Uniqent Studio.app"
          dmg="$(ls "$BUNDLE"/dmg/*.dmg)"
          app_kb="$(du -sk "$app" | cut -f1)"
          dmg_kb="$(du -sk "$dmg" | cut -f1)"
          echo "Uniqent Studio.app: ${app_kb} KB (budget ${MAX_APP_KB} KB)"
          echo "$(basename "$dmg"): ${dmg_kb} KB (budget ${MAX_DMG_KB} KB)"
          over=0
          if [ "$app_kb" -gt "$MAX_APP_KB" ]; then
            echo "::error::Uniqent Studio.app is ${app_kb} KB, over the ${MAX_APP_KB} KB budget"
            over=1
          fi
          if [ "$dmg_kb" -gt "$MAX_DMG_KB" ]; then
            echo "::error::DMG is ${dmg_kb} KB, over the ${MAX_DMG_KB} KB budget"
            over=1
          fi
          exit "$over"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          assets=("$BUNDLE"/dmg/*.dmg "$BUNDLE"/macos/*.app.tar.gz "$BUNDLE"/macos/*.app.tar.gz.sig)
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --title "Uniqent Studio ${GITHUB_REF_NAME#studio-v}" \
            --notes "Universal macOS build (Apple Silicon + Intel). If the app is unsigned, right-click it → Open on first launch."
